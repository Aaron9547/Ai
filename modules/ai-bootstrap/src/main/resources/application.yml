# Ai 进程启动与基础设施连接；可调平台参数见 sys_platform_setting（管理端「平台系统参数」），租户策略见 ten_runtime_setting。

####################################################################################
###################################Server Config####################################
####################################################################################
server:
  port: ${SERVER_PORT:8080}

####################################################################################
#################################Spring Framework###################################
####################################################################################
spring:
  application:
    name: ly-ai-application-svc
  messages:
    basename: llm-admin-meta
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 160MB

####################################################################################
###################################DataSource Config################################
####################################################################################
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://172.16.42.165:3306/test_ai?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08%3A00&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Root@123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

####################################################################################
#####################################Redis Config###################################
####################################################################################
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:172.16.42.165}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: "${SPRING_DATA_REDIS_PASSWORD:Redis@123456}"
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5s}
      database: ${SPRING_DATA_REDIS_DATABASE:0}

####################################################################################
#############################Spring Cloud & Autoconfigure###########################
####################################################################################
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

####################################################################################
#################################MyBatis-Plus Config################################
####################################################################################
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
  type-enums-package: com.aaron.cloud.common.api.enums

####################################################################################
#############################Eureka Service Discovery###############################
####################################################################################
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://192.168.35.211:1200/eureka/}
  instance:
    prefer-ip-address: true

####################################################################################
#################################Ai Platform Config#################################
####################################################################################
ai:
  discovery:
    enabled: ${AI_DISCOVERY_ENABLED:true}
  rocketmq:
    enabled: ${AI_ROCKETMQ_ENABLED:false}
    name-server: ${ROCKETMQ_NAME_SRV:192.168.37.16:9999;192.168.37.17:9999}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:ai-producer}
  memory:
    vector-enabled: ${AI_MEMORY_VECTOR_ENABLED:false}

####################################################################################
#############################Ai Remoting & Providers################################
####################################################################################
  remoting:
    mode: ${AI_REMOTING_MODE:local}
    model-base-url: ${AI_MODEL_BASE_URL:http://127.0.0.1:8080}
    message-base-url: ${AI_MESSAGE_BASE_URL:http://127.0.0.1:8080}
  providers:
    auth: ${AI_PROVIDERS_AUTH:jwt-local}
    oauth2-resource-server:
      jwt-issuer-uri: ${AI_OAUTH2_JWT_ISSUER_URI:}
    vector-store: ${AI_PROVIDERS_VECTOR_STORE:milvus}
    file-storage: ${AI_PROVIDERS_FILE_STORAGE:minio}
    notification: ${AI_PROVIDERS_NOTIFICATION:local}
    infra-via-discovery: ${AI_INFRA_VIA_DISCOVERY:false}
    milvus:
      service-id: ${AI_MILVUS_EUREKA_SERVICE_ID:milvus}
      host: ${AI_MILVUS_HOST:172.16.42.165}
      port: ${AI_MILVUS_PORT:19530}
      token: ${AI_MILVUS_TOKEN:}
      database: ${AI_MILVUS_DATABASE:default}
      secure: ${AI_MILVUS_SECURE:false}
      vector-dimension: ${AI_MILVUS_VECTOR_DIM:2048}
    minio:
      service-id: ${AI_MINIO_EUREKA_SERVICE_ID:minio}
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:8991}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      region: ${MINIO_REGION:}

####################################################################################
##################################Ai RAG Config#####################################
####################################################################################
  rag:
    local-embed-feign:
      base-url: ${AI_RAG_LOCAL_EMBED_FEIGN_BASE_URL:${AI_RAG_ENGINE_BASE_URL:http://192.168.37.31/ly-ai-rag/}}
      service-id: ${AI_RAG_LOCAL_EMBED_FEIGN_SERVICE_ID:rag-embedding-svc}
    elasticsearch:
      enabled: ${AI_RAG_ES_ENABLED:true}
      config:
        cluster-name: ${AI_RAG_ES_CLUSTER_NAME:es-test}
        host-ports: ${AI_RAG_ES_HOST_PORTS:192.168.37.17:19201;192.168.37.17:19202}
        user-name: ${AI_RAG_ES_USERNAME:elastic}
        password: ${AI_RAG_ES_PASSWORD:admin123}
      index-name: ${AI_RAG_ES_INDEX:rag_agent_documents}

####################################################################################
################################Ai Auth & Tenant####################################
####################################################################################
  auth:
    jwt-local:
      secret: ${AI_AUTH_JWT_LOCAL_SECRET:change-me-please-use-32bytes-minimum!!}
  tenant:
    default-id: ${AI_DEFAULT_TENANT_ID:1}
  llm-model:
    api-key-encryption-secret: ${AI_LLM_MODEL_KEY_SECRET:}

####################################################################################
################################Management Actuator###################################
####################################################################################
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

####################################################################################
###################################Logging Config###################################
####################################################################################
logging:
  charset:
    console: ${LOGGING_CHARSET_CONSOLE:UTF-8}
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n%wEx"
  level:
    root: INFO
    com.aaron.cloud: ${LOGGING_LEVEL_COM_AARON_CLOUD:INFO}
    com.netflix.discovery: WARN
    org.elasticsearch.client: ERROR
