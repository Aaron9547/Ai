# Ai 运行时：环境变量覆盖 ${ENV:默认值}；EPP 见 META-INF/spring.factories。Redis 仅 spring.data.redis（必连，无开关）；Eureka 默认与 ly-mc-electricity-meter-svc 同形；MySQL 默认 test_ai。

server:
  # HTTP 端口；覆盖：SERVER_PORT
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ly-ai-application-svc
  messages:
    basename: llm-admin-meta
    encoding: UTF-8
    # 避免 JVM 默认 en_US 时 ResourceBundle 在 zh 资源缺失链上误用英文包（与 LlmAdminMetaMessageSourceConfiguration 一致）
    fallback-to-system-locale: false
  jackson:
    # API 与库表时间展示时区
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 160MB
  datasource:
    # MySQL：与 rag ShardingSphere 同机同账号（192.168.2.37:3306 root/37621040）；默认库 test_ai（Ai 迁移脚本）；与 rag 同用 cloud 库时覆盖 MYSQL_URL 为 rag 的 jdbc 串。
    url: ${MYSQL_URL:jdbc:mysql://192.168.2.37:3306/test_ai?useUnicode=true&characterEncoding=utf8&connectionTimeZone=%2B08%3A00&forceConnectionTimeZoneToSession=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:37621040}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      host: ${SPRING_DATA_REDIS_HOST:192.168.35.210}
      port: ${SPRING_DATA_REDIS_PORT:16377}
      password: "${SPRING_DATA_REDIS_PASSWORD:Ly@!37621040}"
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:20000ms}
  autoconfigure:
    # 注册验证码走租户 SMTP（OpenRegistrationVerificationSender），不用 spring.mail 全局 Bean，避免 MailHealthIndicator 无密码 WARN
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  cloud:
    openfeign:
      circuitbreaker:
        # Feign 与 Resilience4j 熔断集成
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
  type-enums-package: com.aaron.cloud.common.api.enums

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://192.168.35.211:1200/eureka/}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_SECONDS:30}
    lease-expiration-duration-in-seconds: ${EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_SECONDS:90}

ai:
  discovery:
    enabled: ${AI_DISCOVERY_ENABLED:true}
  # 模型用量事件：写 Redis 队列；可与 RocketMQ 投递联动（见 ai.rocketmq）。
  llm-usage:
    redis-queue-key: ${AI_LLM_USAGE_REDIS_QUEUE:ai:queue:llm-usage}
    redis-poll-ms: ${AI_LLM_USAGE_REDIS_POLL_MS:250}
  # 租户运行时表 ten_runtime_setting 读穿缓存 TTL（秒）；无 Redis 时直读库。
  tenant-runtime-settings:
    cache-ttl-seconds: ${AI_TENANT_RUNTIME_SETTINGS_CACHE_TTL:600}
  # 接入方 HMAC/RPM：edge-only=仅在 gateway/bootstrap 边缘验签（默认）；per-service=各服务重复验签（非默认）。
  access-party:
    enforcement: ${AI_ACCESS_PARTY_ENFORCEMENT:edge-only}
  # 管理端租户 LOGO 上传落盘（匿名读取路径见 OpenAdminBrandLogoRestController）；多实例须共享此目录或改对象存储。
  admin:
    brand-logo:
      storage-dir: ${AI_ADMIN_BRAND_LOGO_STORAGE_DIR:}
  # RocketMQ：enabled=true 导入 starter 并启用 Job/用量消费者；name-server、producer-group 由 EPP 映射到 rocketmq.*。
  rocketmq:
    enabled: ${AI_ROCKETMQ_ENABLED:false}
    # 与对端 RocketMQ namesrv 一致
    name-server: ${ROCKETMQ_NAME_SRV:192.168.37.16:9999;192.168.37.17:9999}
    producer-group: ${ROCKETMQ_PRODUCER_GROUP:ai-producer}
    job-topic: ${AI_ROCKETMQ_JOB_TOPIC:ai-job-dispatch}
    job-consumer-group: ${AI_ROCKETMQ_CONSUMER_GROUP:ai-job-consumer}
    llm-usage-topic: ${AI_ROCKETMQ_LLM_USAGE_TOPIC:ai-llm-usage}
    llm-usage-consumer-group: ${AI_ROCKETMQ_LLM_USAGE_CONSUMER_GROUP:ai-llm-usage-consumer}
    memory-abstract-topic: ${AI_ROCKETMQ_MEMORY_ABSTRACT_TOPIC:ai-memory-abstract-refresh}
    memory-abstract-consumer-group: ${AI_ROCKETMQ_MEMORY_ABSTRACT_CONSUMER_GROUP:ai-memory-abstract-consumer}
    message-topic: ${AI_ROCKETMQ_MESSAGE_TOPIC:ai-message-dispatch}
    message-consumer-group: ${AI_ROCKETMQ_MESSAGE_CONSUMER_GROUP:ai-message-consumer}
  # 用户分层记忆：Milvus 具体层向量（可选）、异步抽象层 JSON（RocketMQ / Redis 队列）。
  memory:
    # 进程级：是否走 Milvus 用户记忆向量路径；collection 名与 Redis 队列名见部署文档。
    vector-enabled: ${AI_MEMORY_VECTOR_ENABLED:false}
    milvus-collection: ${AI_MEMORY_MILVUS_COLLECTION:user_memory_chunk}
    abstract-redis-queue-key: ${AI_MEMORY_ABSTRACT_REDIS_QUEUE:ai:queue:memory-abstract}
    abstract-redis-poll-ms: ${AI_MEMORY_ABSTRACT_REDIS_POLL_MS:400}
  # remoting.mode：local=本进程大模型编排（默认）；remote=通过 Feign 调独立模型服务（model-base-url）。
  remoting:
    mode: ${AI_REMOTING_MODE:local}
    model-base-url: ${AI_MODEL_BASE_URL:http://127.0.0.1:8080}
    message-base-url: ${AI_MESSAGE_BASE_URL:http://127.0.0.1:8080}
  # 出站韧性 ai.outbound.*：默认值在 AiOutboundResilienceProperties；勿在 yml 堆叠副本时，用环境变量或 JVM 系统属性覆盖即可（Spring Boot 松散绑定）。
  # 命名规则：前缀 AI_OUTBOUND_ + 属性路径，点/中划线改为下划线并全大写，例如：
  #   AI_OUTBOUND_ENABLED=false
  #   AI_OUTBOUND_STREAM_MAX_ATTEMPTS=5
  #   AI_OUTBOUND_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD=60
  #   AI_OUTBOUND_TENANT_QUARANTINE_ENABLED=false
  # JVM：-Dai.outbound.enabled=false -Dai.outbound.stream-max-attempts=5
  providers:
    # auth：permit=免 JWT（仅联调）；jwt-local=管理端/业务 JWT；oauth2-resource=OAuth2 Resource Server，须配 jwt-issuer-uri。
    auth: ${AI_PROVIDERS_AUTH:jwt-local}
    oauth2-resource-server:
      # oauth2-resource 时必填 Issuer；覆盖：AI_OAUTH2_JWT_ISSUER_URI（由 EPP 写入 spring.security...）
      jwt-issuer-uri: ${AI_OAUTH2_JWT_ISSUER_URI:}
    # vector-store：milvus=向量库 RAG/检索；local=不接 Milvus，相关写向量与检索路径关闭。
    vector-store: ${AI_PROVIDERS_VECTOR_STORE:milvus}
    # file-storage：minio=对象存储；local=本机占位。
    file-storage: ${AI_PROVIDERS_FILE_STORAGE:minio}
    # notification：local=占位；http=预留 HTTP 通知。
    notification: ${AI_PROVIDERS_NOTIFICATION:local}
    # infra-via-discovery：true 且 Eureka 可用时 Milvus/MinIO 优先用注册实例（与 ai.discovery 独立，默认 false）。
    infra-via-discovery: ${AI_INFRA_VIA_DISCOVERY:false}
    milvus:
      service-id: ${AI_MILVUS_EUREKA_SERVICE_ID:milvus}
      # 与对端 Milvus 网关地址同机同端口（如 http://192.168.37.17:19530）
      host: ${AI_MILVUS_HOST:192.168.37.17}
      port: ${AI_MILVUS_PORT:19530}
      token: ${AI_MILVUS_TOKEN:}
      database: ${AI_MILVUS_DATABASE:default}
      secure: ${AI_MILVUS_SECURE:false}
      # 进程默认维数（新租户未在「外观与模型调用」锁定前）；租户覆盖见 ten_runtime_setting.RAG_VECTOR_DIMENSION
      vector-dimension: ${AI_MILVUS_VECTOR_DIM:2048}
    minio:
      service-id: ${AI_MINIO_EUREKA_SERVICE_ID:minio}
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:8991}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      region: ${MINIO_REGION:}
  rag:
    # 进程默认检索模式；租户覆盖见 ten_runtime_setting.RAG_RETRIEVAL_MODE（外观与模型调用）
    retrieval-mode: ${AI_RAG_RETRIEVAL_MODE:milvus_es_hybrid}
    # 向量化：模型在库表 llm_model（VECTOR）。local_deploy=true 时走本地嵌入 Feign：关 Eureka 时必须配直连 base-url（见下行）。
    local-embed-feign:
      # 与对端网关根路径一致（含尾斜杠示例）；优先 AI_RAG_LOCAL_EMBED_FEIGN_BASE_URL，否则 AI_RAG_ENGINE_BASE_URL
      base-url: ${AI_RAG_LOCAL_EMBED_FEIGN_BASE_URL:${AI_RAG_ENGINE_BASE_URL:http://192.168.37.31/ly-ai-rag/}}
      # Eureka 注册名须与对端 spring.application.name 一致，默认占位；覆盖：AI_RAG_LOCAL_EMBED_FEIGN_SERVICE_ID
      service-id: ${AI_RAG_LOCAL_EMBED_FEIGN_SERVICE_ID:rag-embedding-svc}
    elasticsearch:
      # 与对端 elasticsearch 块同形：enabled=false 不装配 ES；混合检索时 enabled=true 并填 config.host-ports（无单独 uris）。
      enabled: ${AI_RAG_ES_ENABLED:true}
      config:
        cluster-name: ${AI_RAG_ES_CLUSTER_NAME:es-test}
        host-ports: ${AI_RAG_ES_HOST_PORTS:192.168.37.17:19201;192.168.37.17:19202}
        user-name: ${AI_RAG_ES_USERNAME:elastic}
        password: ${AI_RAG_ES_PASSWORD:admin123}
      # 与对端 elasticsearch.index-name 默认一致；独立测试索引可设 AI_RAG_ES_INDEX
      index-name: ${AI_RAG_ES_INDEX:rag_agent_documents}
      # 混合检索 ES 分支 min_score（BM25）；过低易混入无关词条命中
      min-score: ${AI_RAG_ES_MIN_SCORE:1.0}
    # 租户通用定时任务（Spring @Scheduled + 表 ten_scheduled_task；网页爬取等为 task_type 枚举扩展）。
    scheduled-tasks:
      poll-cron: ${AI_RAG_SCHEDULED_TASKS_POLL_CRON:0 * * * * *}
      poller-lock-ttl-seconds: ${AI_RAG_SCHEDULED_TASKS_POLLER_LOCK_TTL_SECONDS:55}
      task-lock-ttl-seconds: ${AI_RAG_SCHEDULED_TASKS_TASK_LOCK_TTL_SECONDS:300}
    # 站点爬取执行锁 TTL（秒）；定时任务扫描见 scheduled-tasks。
    site-crawl:
      crawl-lock-ttl-seconds: ${AI_RAG_SITE_CRAWL_LOCK_TTL_SECONDS:21600}
      content-extractor: ${AI_RAG_SITE_CRAWL_CONTENT_EXTRACTOR:jsoup}
      preview-max-chunks: ${AI_RAG_SITE_CRAWL_PREVIEW_MAX_CHUNKS:20}
      preview-max-body-bytes: ${AI_RAG_SITE_CRAWL_PREVIEW_MAX_BODY_BYTES:512000}
      preview-site-sample-urls: ${AI_RAG_SITE_CRAWL_PREVIEW_SITE_SAMPLE_URLS:3}
  # jwt-local 签名密钥；须足够长，勿提交生产明文。email 为注册验证码进程级默认（租户可覆盖见 AUTH_REGISTER_VERIFICATION_JSON）。
  auth:
    jwt-local:
      secret: ${AI_AUTH_JWT_LOCAL_SECRET:change-me-please-use-32bytes-minimum!!}
    email:
      code-ttl-seconds: ${AI_AUTH_EMAIL_CODE_TTL:600}
      send-cooldown-seconds: ${AI_AUTH_EMAIL_SEND_COOLDOWN:60}
  tenant:
    # 访客或未解析租户时的默认 tenantId（与业务种子一致即可）
    default-id: ${AI_DEFAULT_TENANT_ID:1}
  chat:
    attachment:
      # 会话附件原始文件落盘根目录（不入库）；路径段为 tenantId/conversationId/attachmentId
      bin-dir: ${AI_CHAT_ATTACHMENT_BIN_DIR:${user.dir}/data/chat-attachment-bin}
    starter-prompts:
      # 已废弃：每日热点改由 ten_scheduled_task（CHAT_STARTER_DAILY_HOT）+ ai.rag.scheduled-tasks 统一 poller
      poller-cron: ${AI_CHAT_STARTER_POLLER_CRON:0 * * * * *}
  # 管理端 llm_model API Key 等 AES-GCM 加密；须配置随机密钥。可选 ai.cors.fallback-when-no-enabled-rows：库表无启用 CORS 行时的兜底 Origin 列表。
  llm-model:
    api-key-encryption-secret: ${AI_LLM_MODEL_KEY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3

logging:
  # Windows 控制台默认代码页常为 GBK，不设 UTF-8 时中文日志易成「瀵硅瘽闃舵」类乱码；IDE 终端可先执行 chcp 65001
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n%wEx"
  level:
    root: INFO
    com.aaron.cloud: ${LOGGING_LEVEL_COM_AARON_CLOUD:INFO}
    # 第三方周期性 INFO 对排障价值低：Eureka 每 5 分钟刷新注册表；ES 未开安全时每请求一条 WARN
    com.netflix.discovery: WARN
    org.elasticsearch.client: ERROR
