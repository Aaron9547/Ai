# Ai 应用编排（backend + user-web + admin-web）
#
# 前置：cd deploy/infra && docker compose up -d
# 构建并启动：cd deploy && ./install.sh

name: ai-platform

x-backend-env: &backend-env
  env_file:
    - compose.env

services:
  backend:
    <<: *backend-env
    image: ${IMAGE_PREFIX:-ai-platform}/ai-backend:${IMAGE_TAG:-0.1.258-SNAPSHOT}
    container_name: ai-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      MYSQL_URL: ${MYSQL_URL}
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD}
      SPRING_DATA_REDIS_DATABASE: ${SPRING_DATA_REDIS_DATABASE:-0}
      AI_DISCOVERY_ENABLED: "${AI_DISCOVERY_ENABLED:-false}"
      AI_ROCKETMQ_ENABLED: "${AI_ROCKETMQ_ENABLED:-false}"
      ROCKETMQ_NAME_SRV: ${ROCKETMQ_NAME_SRV:-rocketmq-namesrv:9876}
      ROCKETMQ_PRODUCER_GROUP: ${ROCKETMQ_PRODUCER_GROUP:-ai-producer}
      AI_REMOTING_MODE: ${AI_REMOTING_MODE:-local}
      AI_MILVUS_HOST: ${AI_MILVUS_HOST}
      AI_MILVUS_PORT: ${AI_MILVUS_PORT:-19530}
      AI_MILVUS_TOKEN: ${AI_MILVUS_TOKEN:-}
      AI_MILVUS_SECURE: "${AI_MILVUS_SECURE:-false}"
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      AI_RAG_ES_ENABLED: "${AI_RAG_ES_ENABLED:-true}"
      AI_RAG_ES_HOST_PORTS: ${AI_RAG_ES_HOST_PORTS:-elasticsearch:9200}
      AI_RAG_ES_CLUSTER_NAME: ${AI_RAG_ES_CLUSTER_NAME:-es-ai}
      AI_RAG_ES_USERNAME: ${AI_RAG_ES_USERNAME:-}
      AI_RAG_ES_PASSWORD: ${AI_RAG_ES_PASSWORD:-}
      AI_AUTH_JWT_LOCAL_SECRET: ${AI_AUTH_JWT_LOCAL_SECRET}
      AI_LLM_MODEL_KEY_SECRET: ${AI_LLM_MODEL_KEY_SECRET:-}
      AI_DEFAULT_TENANT_ID: ${AI_DEFAULT_TENANT_ID:-1}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/actuator/health || exit 1']
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 120s
    networks:
      - infra

  user-web:
    image: ${IMAGE_PREFIX:-ai-platform}/ai-user-web:${IMAGE_TAG:-0.1.258-SNAPSHOT}
    container_name: ai-user-web
    restart: unless-stopped
    env_file:
      - compose.env
    ports:
      - "${USER_WEB_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - infra

  admin-web:
    image: ${IMAGE_PREFIX:-ai-platform}/ai-admin-web:${IMAGE_TAG:-0.1.258-SNAPSHOT}
    container_name: ai-admin-web
    restart: unless-stopped
    env_file:
      - compose.env
    ports:
      - "${ADMIN_WEB_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - infra

networks:
  infra:
    external: true
    name: ai-infra
